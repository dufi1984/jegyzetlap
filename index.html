<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kártyás Jegyzetlap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Notepad Area (Directly at top of screen) -->
  <main class="viewport-container">
    <div class="paper-container">
      <div class="paper-sheet" id="paper-sheet">

        <!-- Scoreboard Table Container -->
        <div class="table-wrapper" id="table-wrapper">
          <table class="score-table" id="score-table">
            <thead>
              <!-- Player Names Row -->
              <tr id="player-headers-row">
                <!-- Dynamically populated player headers -->
              </tr>
            </thead>

            <!-- Score Entry Rounds (Fills screen) -->
            <tbody id="rounds-tbody">
              <!-- Dynamically populated round rows -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <!-- Live Total Sticky Bottom Bar (Docked above footer, expands upward smoothly) -->
  <div id="total-bottom-bar" class="total-bottom-bar is-hidden">
    <div class="total-paper-container" id="total-paper-container">
      <table class="total-bottom-table">
        <tr id="total-row" class="total-row">
          <!-- Dynamically populated total scores -->
        </tr>
      </table>
    </div>
  </div>

  <!-- Touch-Friendly Footer Toolbar -->
  <footer class="app-footer">
    <!-- Left: Gear + Add User Icon Button -->
    <div class="footer-left">
      <!-- Settings Gear -->
      <button id="settings-btn" class="btn-subtle icon-only-btn" title="Beállítások">
        <svg viewBox="0 0 24 24" class="footer-icon"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 3h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.63c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/></svg>
      </button>
      
      <!-- Add User (Icon only) -->
      <button id="add-player-btn" class="btn-subtle icon-only-btn" title="Új játékos hozzáadása">
        <svg viewBox="0 0 24 24" class="footer-icon"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="19" y1="11" x2="19" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Right: Kuka, Bunkó (Share tray icon), Új kör (Plus icon) -->
    <div class="footer-right">
      <!-- Trash icon button (Clears scores & bunkos) -->
      <button id="reset-table-btn" class="btn-subtle icon-only-btn" title="Adatok és bunkók törlése (nevek megmaradnak)">
        <svg viewBox="0 0 24 24" class="footer-icon"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>

      <!-- Bunkó button with exact iOS/Box-Tray Share icon -->
      <button id="bunko-modal-btn" class="btn-subtle bunko-btn-footer" title="Bunkó kiosztása">
        <svg viewBox="0 0 24 24" class="footer-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        Bunkó
      </button>

      <!-- Új kör (Plus ➕ icon on right) -->
      <button id="new-session-btn" class="btn-subtle btn-new-round" title="Új kör (Pontok lezárása, új forduló indítása)">
        Új kör
        <svg viewBox="0 0 24 24" class="footer-icon icon-right"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </footer>

  <!-- Settings Popover Menu -->
  <div id="settings-popover" class="settings-popover is-hidden">
    <div class="popover-item">
      <label class="popover-label">Játék típusa</label>
      <select id="game-type-select" class="custom-popover-select">
        <option value="snapszer">Snapszer</option>
        <option value="general">Általános</option>
      </select>
    </div>

    <div class="popover-item">
      <label class="popover-label" for="toggle-dark-checkbox">Sötét mód</label>
      <label class="switch">
        <input type="checkbox" id="toggle-dark-checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <div class="popover-item">
      <label class="popover-label" for="toggle-sum-checkbox">Aktív kör szummája</label>
      <label class="switch">
        <input type="checkbox" id="toggle-sum-checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Frissítés (Moved to Settings) -->
    <div class="popover-item popover-action-item">
      <button id="reload-page-btn" class="popover-action-btn" title="Kényszerített frissítés">
        <svg viewBox="0 0 24 24" class="popover-btn-icon"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        Frissítés
      </button>
    </div>
  </div>

  <!-- Simple Bunkó Selection Modal -->
  <div id="bunko-modal" class="modal-overlay is-hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Ki kapta a bunkót?</h2>
        <button id="close-bunko-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="bunko-modal-list">
        <!-- Dynamically populated list of player selectable rows -->
      </div>
      <div class="modal-footer">
        <button id="confirm-bunko-btn" class="btn-confirm-bunko">
          Megerősítés
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
