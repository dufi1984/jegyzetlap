<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kártyás Jegyzetlap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Notepad Area (Directly at top of screen) -->
  <main class="viewport-container">
    <div class="paper-container">
      <div class="paper-sheet" id="paper-sheet">

        <!-- Scoreboard Table Container -->
        <div class="table-wrapper">
          <table class="score-table" id="score-table">
            <thead>
              <!-- Player Names Row -->
              <tr id="player-headers-row">
                <!-- Dynamically populated player headers -->
              </tr>
            </thead>
            
            <!-- Live Total Sticky Row (Disabled by default) -->
            <tbody id="total-tbody" class="total-tbody is-hidden">
              <tr id="total-row" class="total-row">
                <!-- Dynamically populated total scores -->
              </tr>
            </tbody>

            <!-- Score Entry Rounds (Fills screen) -->
            <tbody id="rounds-tbody">
              <!-- Dynamically populated round rows -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Actions (Clean, subtle bottom toolbar) -->
  <footer class="app-footer">
    <button id="add-player-btn" class="btn-subtle" title="Új játékos oszlop">
      👤 Új játékos
    </button>
    <button id="bunko-modal-btn" class="btn-subtle" title="Bunkó kiosztása">
      ⚫ Bunkó
    </button>
    <button id="new-session-btn" class="btn-subtle" title="Pontok törlése a következő menethez (bunkók megmaradnak)">
      🧹 Új menet
    </button>
    <button id="toggle-sum-btn" class="btn-subtle">
      Σ Szumma: <span id="sum-status-text">KI</span>
    </button>
    <button id="reset-btn" class="btn-subtle btn-reset" title="Minden pont és bunkó törlése">
      🔄 Új játék
    </button>
  </footer>

  <!-- Simple Bunkó Selection Modal -->
  <div id="bunko-modal" class="modal-overlay is-hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Ki kapta a bunkót?</h2>
        <button id="close-modal-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="bunko-modal-list">
        <!-- Dynamically populated list of player selectable rows -->
      </div>
      <div class="modal-footer">
        <button id="confirm-bunko-btn" class="btn-confirm-bunko">
          Megerősítés
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
