<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kártyás Jegyzetlap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Notepad Area (Directly at top of screen) -->
  <main class="viewport-container">
    <div class="paper-container">
      <div class="paper-sheet" id="paper-sheet">

        <!-- Scoreboard Table Container -->
        <div class="table-wrapper">
          <table class="score-table" id="score-table">
            <thead>
              <!-- Player Names Row -->
              <tr id="player-headers-row">
                <!-- Dynamically populated player headers -->
              </tr>
            </thead>
            
            <!-- Live Total Sticky Row (Disabled by default) -->
            <tbody id="total-tbody" class="total-tbody is-hidden">
              <tr id="total-row" class="total-row">
                <!-- Dynamically populated total scores -->
              </tr>
            </tbody>

            <!-- Score Entry Rounds (Fills screen) -->
            <tbody id="rounds-tbody">
              <!-- Dynamically populated round rows -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Toolbar (Left: Gear, Right: Bunkó, Új menet, Új játékos) -->
  <footer class="app-footer">
    <!-- Left: Settings Gear -->
    <div class="footer-left">
      <button id="settings-btn" class="btn-subtle icon-only-btn" title="Beállítások">
        <svg viewBox="0 0 24 24" class="footer-icon"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 3h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.63c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/></svg>
      </button>
    </div>

    <!-- Right: Action Buttons with Text Labels (Bunkó, Új menet, Új játékos) -->
    <div class="footer-right">
      <!-- 1. Bunkó button (Shown in Snapszer mode, leftmost of 3) -->
      <button id="bunko-modal-btn" class="btn-subtle bunko-btn-footer" title="Bunkó kiosztása">
        ⚫ Bunkó
      </button>

      <!-- 2. Új menet (Middle button) -->
      <button id="new-session-btn" class="btn-subtle" title="Új menet (Pontok törlése)">
        🔄 Új menet
      </button>

      <!-- 3. Új játékos (Rightmost button) -->
      <button id="add-player-btn" class="btn-subtle" title="Új játékos hozzáadása">
        ➕ Új játékos
      </button>
    </div>
  </footer>

  <!-- Settings Modal (Fogaskerék menü - Tiszta beállítások gomb nélkül) -->
  <div id="settings-modal" class="modal-overlay is-hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>⚙️ Beállítások</h2>
        <button id="close-settings-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body settings-body">
        
        <!-- Game Type Selector -->
        <div class="setting-item">
          <label class="setting-label">Játék típusa</label>
          <div class="setting-control">
            <select id="game-type-select" class="custom-select">
              <option value="snapszer">Snapszer</option>
              <option value="general">Általános</option>
            </select>
          </div>
        </div>

        <!-- Szumma sáv Toggle -->
        <div class="setting-item">
          <label class="setting-label" for="toggle-sum-checkbox">Szumma sáv</label>
          <div class="setting-control">
            <label class="switch">
              <input type="checkbox" id="toggle-sum-checkbox">
              <span class="slider"></span>
            </label>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Simple Bunkó Selection Modal -->
  <div id="bunko-modal" class="modal-overlay is-hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Ki kapta a bunkót?</h2>
        <button id="close-bunko-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="bunko-modal-list">
        <!-- Dynamically populated list of player selectable rows -->
      </div>
      <div class="modal-footer">
        <button id="confirm-bunko-btn" class="btn-confirm-bunko">
          Megerősítés
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
